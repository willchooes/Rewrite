name: "字母圈 zimuquan VIP 解锁"
description: "解除 zimuquan.top 播放页的 VIP 遮罩，点击遮罩上的按钮直接取源播放（本地脚本版）"
author: "Little Code Sauce"
icon: "play.rectangle.fill"

# 本地版：script_url 指向与本模块同目录的脚本文件名，无需任何远程托管。
# 把 zimuquan.local.yaml 与 zimuquan.js 放在同一个目录（Egern 可访问的文件目录）即可。
# 若同目录文件名不生效，可依次尝试 "./zimuquan.js" 或写绝对路径。
scriptings:
  - http_response:
      name: "zimuquan VIP 解锁"
      match: "^https?://(?:www\\.)?zimuquan\\.top/index\\.php/vod/(?:play|detail)/"
      script_url: "zimuquan.js"
      body_required: true
      max_size: 8388608
      timeout: 30

mitm:
  hostnames:
    - "zimuquan.top"
    - "www.zimuquan.top"
